<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#24150f">
<title>蟑螂去死！｜MAIMINE STUDIO</title>

<style>
*{
box-sizing:border-box
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#24150f;
font-family:system-ui,"Noto Sans TC",sans-serif;
touch-action:manipulation;
user-select:none;
-webkit-user-select:none
}

#app{
position:relative;
width:100%;
height:100%;
max-width:520px;
margin:auto;
overflow:hidden;
background:#b98558;
box-shadow:0 0 30px #0008
}

#cover{
position:absolute;
inset:0;
z-index:10;
background:url('images/cover.png') center/100% 100% no-repeat
}

#cover button{
position:absolute;
border:0;
background:transparent;
cursor:pointer;
color:transparent;
-webkit-tap-highlight-color:transparent
}

#start{
left:8%;
top:75.5%;
width:84%;
height:10.5%
}

#record{
left:22%;
top:87%;
width:56%;
height:8%
}

#game{
display:none;
position:absolute;
inset:0;
overflow:hidden;
background:#bb8c64 url('images/floor_long.png') center top/100% auto no-repeat
}

#hud{
position:absolute;
z-index:5;
top:calc(env(safe-area-inset-top) + 9px);
left:13px;
right:13px;
display:flex;
justify-content:space-between;
align-items:center;
color:#fff8e8;
font-weight:1000;
font-size:clamp(18px,5vw,25px);
text-shadow:2px 3px 0 #28170f,-1px -1px #28170f;
pointer-events:none
}

.hudbox{
background:#2a170ed9;
border:3px solid #fff0d5;
border-radius:16px;
padding:4px 12px;
box-shadow:0 3px 0 #29170e
}

#bugs{
position:absolute;
inset:0;
z-index:2
}

.roach{
position:absolute;
width:clamp(86px,25vw,138px);
height:auto;
cursor:pointer;
touch-action:manipulation;
filter:none;
transform-origin:center;
z-index:2;
-webkit-tap-highlight-color:transparent
}

.roach.shake{
animation:shake .17s 2
}

.roach.blood{
animation:shake .24s 2;
filter:saturate(1.3)
}

.roach.dead{
animation:fall .42s forwards;
pointer-events:none
}

@keyframes shake{
0%{translate:0 0;rotate:0}
20%{translate:-8px 2px;rotate:-8deg}
45%{translate:8px -3px;rotate:9deg}
70%{translate:-5px 2px;rotate:-5deg}
100%{translate:0 0;rotate:0}
}

@keyframes fall{
to{
transform:rotate(90deg) scale(.8);
opacity:.95
}
}

#arm{
position:absolute;
right:-8px;
bottom:-22px;
width:min(76vw,380px);
height:auto;
z-index:4;
transform-origin:88% 94%;
pointer-events:none;
transition:transform .12s ease-out;
filter:none
}

#arm.swing{
transform:rotate(-39deg) translate(-27px,-35px) scale(.95)
}

#flash{
position:absolute;
inset:0;
z-index:6;
background:#fff;
opacity:0;
pointer-events:none
}

#fly{
position:absolute;
display:none;
z-index:8;
width:min(58vw,270px);
left:50%;
top:48%;
transform:translate(-50%,-50%) scale(.7);
filter:none;
animation:flyburst .42s ease-out forwards
}

@keyframes flyburst{
to{
transform:translate(-50%,-50%) scale(1.18) rotate(-8deg)
}
}

#fly img{
width:100%
}

#overlay{
position:absolute;
inset:0;
z-index:12;
display:none;
align-items:center;
justify-content:center;
background:#160d09c9;
color:#fff3df;
text-align:center;
padding:24px
}

#panel{
background:#f3d49c;
color:#26170e;
border:6px solid #26170e;
border-radius:28px;
padding:24px 20px;
box-shadow:0 8px 0 #26170e;
width:min(86%,390px);
font-weight:1000
}

#panel h1{
margin:0 0 8px;
font-size:clamp(28px,8vw,38px);
line-height:1.1
}

#panel p{
font-size:21px;
margin:10px
}

#panel button{
border:5px solid #26170e;
border-radius:24px;
background:#e82d20;
color:white;
text-shadow:1px 2px #26170e;
padding:12px 26px;
font-size:23px;
font-weight:1000;
margin-top:12px;
box-shadow:0 4px 0 #26170e
}

#toast{
position:absolute;
z-index:9;
top:23%;
left:50%;
transform:translateX(-50%);
font-weight:1000;
font-size:24px;
color:#fff;
text-shadow:2px 3px #27150d;
opacity:0;
pointer-events:none;
white-space:nowrap
}

#toast.show{
animation:toast .65s ease-out
}

@keyframes toast{
0%{
opacity:0;
translate:0 15px;
scale:.7
}
25%{
opacity:1;
translate:0 0;
scale:1.1
}
80%{
opacity:1
}
100%{
opacity:0;
translate:0 -24px
}
}

#hint{
position:absolute;
bottom:12px;
left:0;
right:0;
text-align:center;
z-index:1;
color:#fff7e7;
font-size:12px;
font-weight:800;
text-shadow:1px 2px #26170e;
opacity:.85;
pointer-events:none
}

@media(min-height:850px){
#arm{
width:min(68vw,350px)
}
}
</style>
</head>

<body>

<main id="app">

<div id="cover">

<button id="start" aria-label="開始打"></button>

<button id="record" aria-label="最高紀錄"></button>

</div>

<section id="game">

<div id="hud">

<span class="hudbox">
🪳 <b id="score">0</b>
</span>

<span class="hudbox">
⏱ <b id="time">20</b>
</span>

</div>

<div id="bugs"></div>

<img id="arm" src="images/arm.png" alt="拖鞋手臂">

<div id="flash"></div>

<div id="fly">
<img src="images/flying_roach.png" alt="飛蟑螂">
</div>

<div id="toast"></div>

<div id="hint">夢的翅膀 已經受了傷 ～</div>

</section>

<div id="overlay">

<div id="panel">

<h1 id="resultTitle">時間到！</h1>

<p>擊殺：<span id="finalScore">0</span></p>

<p>最高紀錄：<span id="best">0</span></p>

<button id="again">再打一次</button>

</div>

</div>

</main>

<script>

/* =========================================
   DOM
========================================= */

const $=s=>document.querySelector(s);

const cover=$('#cover');
const game=$('#game');
const bugs=$('#bugs');
const arm=$('#arm');
const overlay=$('#overlay');
const flash=$('#flash');
const fly=$('#fly');


/* =========================================
   音效設定
========================================= */

const MUSIC_PATH='music/';

const sounds={

home:new Audio(MUSIC_PATH+'first.mp3'),

game:new Audio(MUSIC_PATH+'start.mp3'),

punch1:new Audio(MUSIC_PATH+'punch1.mp3'),

punch2:new Audio(MUSIC_PATH+'punch2.mp3'),

punch3:new Audio(MUSIC_PATH+'punch3.mp3'),

over:new Audio(MUSIC_PATH+'over.mp3'),

flyover:new Audio(MUSIC_PATH+'flyover.mp3')

};


/* 背景音樂設定 */

sounds.home.loop=true;
sounds.game.loop=true;


/* 音量設定 */

sounds.home.volume=.65;
sounds.game.volume=.65;


/* 音效音量 */

sounds.punch1.volume=1;
sounds.punch2.volume=1;
sounds.punch3.volume=1;
sounds.over.volume=1;
sounds.flyover.volume=1;


/* 音效播放狀態 */

let homeMusicStarted=false;


/* 播放音效 */

function playSound(audio){

if(!audio)return;

try{

audio.currentTime=0;

const result=audio.play();

if(result&&typeof result.catch==='function'){
result.catch(()=>{});
}

}catch(e){}

}


/* 停止音效 */

function stopSound(audio){

if(!audio)return;

try{

audio.pause();
audio.currentTime=0;

}catch(e){}

}


/* 停止所有音效 */

function stopAllSounds(){

Object.values(sounds).forEach(audio=>{
stopSound(audio);
});

}


/* 播放首頁音樂 */

function playHomeMusic(){

if(playing)return;

stopSound(sounds.game);

playSound(sounds.home);

homeMusicStarted=true;

}


/* 播放遊戲音樂 */

function playGameMusic(){

stopSound(sounds.home);

playSound(sounds.game);

}


/* iPhone Safari 自動播放限制處理 */

function enableAudioAfterInteraction(){

if(playing)return;

if(!homeMusicStarted){

playHomeMusic();

}

}

document.addEventListener('pointerdown',enableAudioAfterInteraction,{once:true});

document.addEventListener('touchstart',enableAudioAfterInteraction,{once:true});


/* =========================================
   遊戲設定
========================================= */

const BEST_KEY='maimine_roach_killer_best_v1';

let score=0;
let time=20;

let best=Number(localStorage.getItem(BEST_KEY)||0);

let playing=false;

let timer=null;
let spawnTimer=null;

let spawnCount=0;

let mineAt=0;
let mineSpawned=false;

let ending=false;

const rand=(a,b)=>a+Math.random()*(b-a);


/* =========================================
   最高紀錄
========================================= */

$('#record').addEventListener('click',()=>{

alert('最高紀錄：'+best+' 隻');

});


/* =========================================
   開始遊戲
========================================= */

$('#start').addEventListener('click',start);

$('#again').addEventListener('click',start);


function start(){

clearAll();

stopSound(sounds.home);
stopSound(sounds.over);
stopSound(sounds.flyover);

score=0;
time=20;

playing=true;
ending=false;

spawnCount=0;
mineSpawned=false;

mineAt=5+Math.floor(Math.random()*13);

$('#score').textContent='0';
$('#time').textContent='20';
$('#best').textContent=best;

bugs.innerHTML='';

overlay.style.display='none';

cover.style.display='none';

game.style.display='block';

arm.style.transform='';

fly.style.transform='';
fly.style.display='none';


/* 遊戲開始音樂 */

playGameMusic();


/* 生成第一隻蟑螂 */

spawn();


/* 定時生成蟑螂 */

spawnTimer=setInterval(spawn,760);


/* 倒數 */

timer=setInterval(()=>{

if(!playing)return;

time--;

$('#time').textContent=time;

if(time<=0){

time=0;

$('#time').textContent='0';

end(false);

}

},1000);

}


/* =========================================
   清除計時器
========================================= */

function clearAll(){

clearInterval(timer);
clearInterval(spawnTimer);

timer=null;
spawnTimer=null;

}


/* =========================================
   生成蟑螂
========================================= */

function spawn(){

if(!playing||bugs.children.length>=6)return;

spawnCount++;

let isMine=!mineSpawned&&spawnCount>=mineAt;

let n=1+Math.floor(Math.random()*4);

let el=document.createElement('img');

el.src=isMine
?'images/mine_crawl.png'
:`images/roach${n}.png`;

el.className='roach'+(isMine?' mine':'');
el.dataset.mine=isMine?'1':'0';
el.dataset.n=n;
el.dataset.hit='0';

if(isMine){

mineSpawned=true;

el.style.width='clamp(92px,26vw,142px)';

el.dataset.mine='1';

el.alt='特殊蟑螂';

}

let w=game.clientWidth;
let h=game.clientHeight;

el.style.width=isMine
?'clamp(92px,26vw,142px)'
:rand(88,132)+'px';

el.style.left=rand(5,Math.max(8,w-145))+'px';

el.style.top=rand(76,Math.max(100,h-210))+'px';

el.style.rotate=rand(-22,22)+'deg';

el.addEventListener('pointerdown',e=>{

e.preventDefault();

hit(el,e);

});

bugs.appendChild(el);

wander(el);

}


/* =========================================
   蟑螂移動
========================================= */

function wander(el){

let t=setInterval(()=>{

if(!playing||!el.isConnected||el.classList.contains('dead')){

clearInterval(t);

return;

}

let x=parseFloat(el.style.left)||0;
let y=parseFloat(el.style.top)||0;

el.style.left=Math.max(3,Math.min(game.clientWidth-100,x+rand(-24,24)))+'px';

el.style.top=Math.max(70,Math.min(game.clientHeight-155,y+rand(-19,19)))+'px';

el.style.rotate=rand(-30,30)+'deg';

},650+Math.random()*350);

}


/* =========================================
   點擊蟑螂
========================================= */

function hit(el,e){

if(!playing||el.classList.contains('dead'))return;


/* =========================================
   飛蟑螂結局
========================================= */

if(el.dataset.mine==='1'){

el.classList.add('dead');

el.style.opacity='0';

fly.style.display='block';

fly.style.left=(parseFloat(el.style.left)+el.offsetWidth/2)+'px';

fly.style.top=(parseFloat(el.style.top)+el.offsetHeight/2)+'px';

toast('糟了！牠會飛！');


/* 延遲結束，讓飛蟑螂動畫顯示 */

setTimeout(()=>{

end(true);

},420);

return;

}


/* =========================================
   拖鞋動畫
========================================= */

arm.classList.remove('swing');

void arm.offsetWidth;

arm.classList.add('swing');

setTimeout(()=>arm.classList.remove('swing'),145);


/* =========================================
   畫面閃光
========================================= */

flash.style.opacity='.28';

setTimeout(()=>flash.style.opacity='0',55);


/* =========================================
   蟑螂受擊
========================================= */

let hits=Number(el.dataset.hit)+1;

el.dataset.hit=hits;

el.classList.remove('shake','blood');

void el.offsetWidth;


/* =========================================
   第一擊
========================================= */

if(hits===1){

el.src='images/reaction1.png';

el.classList.add('shake');

playSound(sounds.punch1);

toast('啪！再補一下！');


/* =========================================
   第二擊
========================================= */

}else if(hits===2){

el.src='images/reaction2.png';

el.classList.add('blood');

playSound(sounds.punch2);

toast('受傷了！再一下！');


/* =========================================
   第三擊
========================================= */

}else{

el.src='images/reaction3.png';

el.classList.add('dead');

playSound(sounds.punch3);

score++;

$('#score').textContent=score;


/* 更新最高紀錄 */

if(score>best){

best=score;

localStorage.setItem(BEST_KEY,score);

}

toast('擊殺 +1');

setTimeout(()=>el.remove(),470);

}

}


/* =========================================
   提示文字
========================================= */

function toast(s){

let t=$('#toast');

t.textContent=s;

t.classList.remove('show');

void t.offsetWidth;

t.classList.add('show');

}


/* =========================================
   遊戲結束
========================================= */

function end(flew){

if(!playing||ending)return;

playing=false;
ending=true;

clearAll();


/* 停止遊戲背景音樂 */

stopSound(sounds.game);


/* 隱藏飛蟑螂 */

fly.style.display='none';


/* 更新最高紀錄 */

if(score>best){

best=score;

localStorage.setItem(BEST_KEY,score);

}


/* 結局音效 */

if(flew){

playSound(sounds.flyover);

}else{

playSound(sounds.over);

}


/* 顯示結果 */

$('#resultTitle').textContent=flew
?'OMG 有飛蟑螂！'
:'時間到！';

$('#finalScore').textContent=score;

$('#best').textContent=best;

overlay.style.display='flex';

}


/* =========================================
   首頁音樂啟動
========================================= */

playHomeMusic();


</script>

</body>
</html>
