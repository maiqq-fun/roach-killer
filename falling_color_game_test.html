<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>小遊戲測試版</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#310909;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;touch-action:none}
  #game{position:relative;width:100vw;height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#650e13 0%,#390909 58%,#210505 100%);touch-action:none}
  #hud{position:absolute;z-index:5;top:env(safe-area-inset-top,12px);left:0;right:0;padding:18px 18px 10px;display:flex;justify-content:space-between;gap:12px;font-weight:700;text-shadow:0 2px 8px #000}
  .stat{font-size:14px;letter-spacing:.04em}.stat b{display:block;font-size:24px;margin-top:3px}
  #hint{position:absolute;top:82px;width:100%;text-align:center;font-size:12px;opacity:.65;letter-spacing:.12em}
  #player{position:absolute;bottom:calc(38px + env(safe-area-inset-bottom));left:50%;width:66px;height:66px;border:5px solid white;border-radius:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;color:white;font-size:34px;font-weight:300;line-height:1;background:#ffffff12;box-shadow:0 0 18px #ffffff30;z-index:3;will-change:left}
  .fall{position:absolute;width:34px;height:34px;border-radius:50%;z-index:2;box-shadow:0 0 15px currentColor;will-change:transform}
  .blue{background:#079df2;color:#079df2}.orange{background:#ff8b00;color:#ff8b00}
  #overlay{position:absolute;inset:0;z-index:10;background:#180404b8;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;backdrop-filter:blur(3px)}
  #panel{width:min(330px,100%);padding:28px 22px;border:1px solid #ffffff35;border-radius:22px;background:#330c0ce8;box-shadow:0 20px 60px #0008}
  h1{font-size:27px;margin:0 0 10px;letter-spacing:.04em}p{line-height:1.65;color:#f1dede;font-size:14px;margin:10px 0 22px}
  button{border:0;border-radius:999px;padding:14px 30px;background:#fff;color:#350909;font-size:16px;font-weight:800;letter-spacing:.05em}
  #result{font-size:28px;font-weight:800;margin:12px 0}
  .hidden{display:none!important}
  #toast{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:24px;z-index:6;opacity:0;pointer-events:none;text-shadow:0 2px 10px #000}
</style>
</head>
<body>
<div id="game">
  <div id="hud">
    <div class="stat">SCORE<b id="score">0</b></div>
    <div class="stat" style="text-align:right">TIME<b id="time">0.0s</b></div>
  </div>
  <div id="hint">🔵 CATCH　　🟠 AVOID</div>
  <div id="player">☺</div>
  <div id="toast">+10</div>
  <div id="overlay">
    <div id="panel">
      <h1 id="title">接藍色・躲橘色</h1>
      <p id="desc">手指在畫面左右滑動，控制底部的小白臉。<br>接住藍色 +10，碰到橘色就結束。<br>試著撐久一點！</p>
      <div id="result" class="hidden"></div>
      <button id="start">開始遊戲</button>
    </div>
  </div>
</div>
<script>
(() => {
 const game=document.getElementById('game'), player=document.getElementById('player'), overlay=document.getElementById('overlay');
 const scoreEl=document.getElementById('score'), timeEl=document.getElementById('time'), toast=document.getElementById('toast');
 let running=false, score=0, startAt=0, lastSpawn=0, lastFrame=0, items=[], raf=0, spawnEvery=760, speed=150, px=innerWidth/2, elapsed=0;
 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 function moveTo(x){px=clamp(x,35,innerWidth-35);player.style.left=px+'px'}
 function pointer(e){const r=game.getBoundingClientRect();moveTo(e.clientX-r.left)}
 game.addEventListener('pointerdown',e=>{if(running){game.setPointerCapture?.(e.pointerId);pointer(e)}});
 game.addEventListener('pointermove',e=>{if(running && (e.buttons||e.pointerType==='touch'))pointer(e)});
 function showToast(t){toast.textContent=t;toast.style.opacity='1';toast.style.transform='translate(-50%,-50%) scale(1.15)';setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translate(-50%,-50%) scale(1)'},350)}
 function spawn(){
   const el=document.createElement('div'), blue=Math.random()<.64;
   el.className='fall '+(blue?'blue':'orange');
   const size=blue?30+Math.random()*12:32+Math.random()*12;
   const x=12+Math.random()*(innerWidth-size-24);
   el.style.width=el.style.height=size+'px';el.style.left=x+'px';el.style.top=(-size)+'px';
   game.appendChild(el);items.push({el,x,y:-size,size,blue,vy:speed*(.75+Math.random()*.65)});
 }
 function start(){
   cancelAnimationFrame(raf);items.forEach(o=>o.el.remove());items=[];
   score=0;elapsed=0;speed=150;spawnEvery=760;lastSpawn=0;lastFrame=0;startAt=performance.now();running=true;
   scoreEl.textContent='0';timeEl.textContent='0.0s';moveTo(innerWidth/2);
   overlay.classList.add('hidden');raf=requestAnimationFrame(loop);
 }
 function end(){
   running=false;cancelAnimationFrame(raf);overlay.classList.remove('hidden');
   document.getElementById('title').textContent='GAME OVER';
   document.getElementById('desc').textContent='這次的成績：';
   document.getElementById('result').textContent=score+' 分 · '+elapsed.toFixed(1)+' 秒';
   document.getElementById('result').classList.remove('hidden');document.getElementById('start').textContent='再玩一次';
 }
 function loop(now){
   if(!running)return;
   const dt=Math.min((now-(lastFrame||now))/1000,.035);lastFrame=now;elapsed=(now-startAt)/1000;
   timeEl.textContent=elapsed.toFixed(1)+'s';
   if(now-lastSpawn>Math.max(300,spawnEvery-elapsed*3)){spawn();lastSpawn=now}
   speed=150+Math.min(elapsed*3,170);spawnEvery=Math.max(350,760-elapsed*4);
   const pr=player.getBoundingClientRect(), gameR=game.getBoundingClientRect();
   const p={x:px-33,y:gameR.height-(38+parseFloat(getComputedStyle(game).paddingBottom||0))-33-66,size:66};
   for(let i=items.length-1;i>=0;i--){
     const o=items[i];o.y+=o.vy*dt;o.el.style.transform=`translateY(${o.y}px)`;
     const cx=o.x+o.size/2, cy=o.y+o.size/2;
     const playerY=gameR.height-(38+66+parseFloat(getComputedStyle(game).paddingBottom||0));
     const hit=cx>px-31-o.size/2&&cx<px+31+o.size/2&&cy>playerY&&cy<playerY+66+o.size;
     if(hit){
       if(o.blue){score+=10;scoreEl.textContent=score;showToast('+10');o.el.remove();items.splice(i,1);continue}
       o.el.remove();items.splice(i,1);end();return;
     }
     if(o.y>gameR.height+50){o.el.remove();items.splice(i,1)}
   }
   raf=requestAnimationFrame(loop);
 }
 document.getElementById('start').addEventListener('click',start);
 addEventListener('resize',()=>moveTo(px));
})();
</script>
</div>
</body>
</html>
